name: Windows app

# Runs every test on real Windows (the limit reporter under Windows PowerShell 5.1),
# builds the installer, and attaches it to a GitHub Release when a v* tag is pushed.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test on Windows (reporter runs in Windows PowerShell 5.1)
        env:
          PWSH: powershell
        run: npm test
      - name: Build the installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: project-router-installer
          path: desktop/dist/*.exe
          if-no-files-found: error
      - name: Attach to a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
