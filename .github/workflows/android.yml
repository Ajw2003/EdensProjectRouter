name: Android app

# Uses the Android SDK already on GitHub's ubuntu runners (ANDROID_HOME); setup-android@v3 failed asking for the removed "tools" package.
# Builds the debug-signed APK on every push, and attaches it to a GitHub Release when a v* tag is pushed.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the app dependencies
        working-directory: android-app
        run: npm ci
      - name: Copy the web screens into the Android project
        working-directory: android-app
        run: npx cap sync android
      - name: Build the debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: edens-router-apk
          path: android-app/android/app/build/outputs/apk/debug/EdensRouter.apk
          if-no-files-found: error
      - name: Attach to a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-app/android/app/build/outputs/apk/debug/EdensRouter.apk
