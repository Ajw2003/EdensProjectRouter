<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" font-family="Segoe UI,Arial,sans-serif">
<rect width="720" height="240" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2433"/></marker></defs>
<g font-size="12" text-anchor="middle">
<rect x="225" y="20" width="270" height="64" rx="12" fill="#1d2433"/><text x="360" y="46" fill="#fff" font-weight="700">Claude, running in a hidden terminal</text><text x="360" y="66" fill="#cfd6e4">the real claude command, one account</text>
<rect x="20" y="150" width="200" height="64" rx="12" fill="#f4f6fa" stroke="#d8dce6"/><text x="120" y="176" fill="#1d2433" font-weight="700">Terminal view</text><text x="120" y="196" fill="#6b7385">the screen itself, as it is</text>
<rect x="260" y="150" width="200" height="64" rx="12" fill="#f4f6fa" stroke="#d8dce6"/><text x="360" y="176" fill="#1d2433" font-weight="700">Transcript file</text><text x="360" y="196" fill="#6b7385">every message and tool, as data</text>
<rect x="500" y="150" width="200" height="64" rx="12" fill="#f4f6fa" stroke="#d8dce6"/><text x="600" y="176" fill="#1d2433" font-weight="700">Visual view</text><text x="600" y="196" fill="#6b7385">bubbles, cards, pages, questions</text>
</g>
<path d="M300 86 L140 146" stroke="#1d2433" stroke-width="2" marker-end="url(#a)"/><text x="190" y="108" font-size="11" fill="#1d2433">screen output</text>
<path d="M360 86 V146" stroke="#1d2433" stroke-width="2" marker-end="url(#a)"/><text x="368" y="122" font-size="11" fill="#1d2433">writes as it works</text>
<path d="M462 182 H496" stroke="#1d2433" stroke-width="2" marker-end="url(#a)"/>
<path d="M600 146 V52 H500" stroke="#b35f00" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#a)"/>
<text x="610" y="90" font-size="11" fill="#b35f00">your tap or message,</text><text x="610" y="106" font-size="11" fill="#b35f00">sent as the keys</text><text x="610" y="122" font-size="11" fill="#b35f00">you would press</text>
</svg>
